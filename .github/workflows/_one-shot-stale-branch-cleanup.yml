name: One-shot stale branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_one-shot-stale-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Normalize bootstrap candidate metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/candidates/2026-08/2026-08-11-engineering-evidence-2026-08-ab25a976.md")
          if path.exists():
              text = path.read_text(encoding="utf-8")
              first, sep, rest = text.partition("\n")
              prefixes = ("<!-- factory_meta: ", "<!-- pipeline_meta: ")
              for prefix in prefixes:
                  if first.startswith(prefix) and first.endswith(" -->"):
                      meta = json.loads(first[len(prefix):-4])
                      meta["idea_source"] = "public-github-bootstrap"
                      meta.pop("bootstrap_reason", None)
                      first = "<!-- pipeline_meta: " + json.dumps(meta, ensure_ascii=False) + " -->"
                      path.write_text(first + sep + rest, encoding="utf-8")
                      break
          PY

      - name: Commit metadata cleanup
        shell: bash
        run: |
          git add artifacts/candidates/2026-08
          if ! git diff --cached --quiet; then
            git config user.name "repository-hygiene[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: normalize legacy bootstrap metadata"
            git push
          fi

      - name: Delete audited stale branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "chore/run-article-factory-now"
            "feat/graphiti-idea-loop"
            "feat/monthly-lapras-article-factory"
            "fix/factory-shadow-run-hardening"
            "fix/github-models-api-2026"
            "fix/models-runtime-blocker"
            "fix/month-end-quality-selection"
            "fix/month-end-quality-selection-pipeline"
            "temp/noop"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
