name: Article Pipeline CI

on:
  pull_request:
    paths:
      - "pipeline/**"
      - "tests/**"
      - "docs/**"
      - "articles/**"
      - "artifacts/**"
      - "demos/**"
      - "scripts/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/article-pipeline.yml"
      - ".github/workflows/article-pipeline-ci.yml"
      - ".github/workflows/zenn-manual-release.yml"
      - ".github/workflows/zenn-production-verify.yml"
  push:
    branches:
      - main
    paths:
      - "pipeline/**"
      - "tests/**"
      - "docs/**"
      - "articles/**"
      - "artifacts/**"
      - "demos/**"
      - "scripts/**"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/article-pipeline.yml"
      - ".github/workflows/article-pipeline-ci.yml"
      - ".github/workflows/zenn-manual-release.yml"
      - ".github/workflows/zenn-production-verify.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Zenn article slug contract
        run: python -m pipeline.zenn_slug
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Compile
        run: python -m compileall pipeline demos/python-syntax-gate/syntax_gate.py
      - name: Contract tests
        run: python -m unittest discover -s tests -v
      - name: Publication transition guard
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if printf '%s' "$base" | grep -Eq '^0+$'; then
            echo "Initial history: no publication diff to validate"
            exit 0
          fi
          git cat-file -e "$base^{commit}" 2>/dev/null || git fetch origin "$base" --depth=1
          git cat-file -e "$head^{commit}" 2>/dev/null || git fetch origin "$head" --depth=1
          python -m pipeline.publication_diff --base "$base" --head "$head"
      - name: Zenn CLI compatibility
        run: bash scripts/zenn-render-check.sh
      - name: Zenn API response control
        shell: bash
        run: |
          for slug in \
            2026-08-15-ai-character-intelligence-muchio \
            2026-08-14-05-compatibility-is-not-validation \
            2026-08-15-affected-set-is-a-contract \
            2026-08-16-ai-added-decision-cost-audit; do
            echo "===== $slug ====="
            code="$(curl --silent --show-error --location --output /tmp/zenn-body --write-out '%{http_code}' "https://zenn.dev/api/articles/$slug")"
            echo "HTTP $code"
            cat /tmp/zenn-body
            echo
          done
      - name: Demo JavaScript syntax
        run: |
          node --check demos/_shared/pyodide-worker.mjs
          node --check demos/python-syntax-gate/app.mjs
      - name: Demo static route smoke
        shell: bash
        run: |
          python -m http.server 8000 >/tmp/articles-demo-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8000/demos/python-syntax-gate/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              cat /tmp/articles-demo-http.log
              exit 1
            fi
            sleep 1
          done
          for path in \
            demos/python-syntax-gate/demo.json \
            demos/python-syntax-gate/syntax_gate.py \
            demos/_shared/pyodide-worker.mjs; do
            curl --fail --silent --show-error "http://127.0.0.1:8000/$path" >/dev/null
          done
      - name: Repository and privacy audit
        run: python -m pipeline.audit
      - name: Verify clean checkout
        shell: bash
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          status="$(git status --porcelain --untracked-files=all)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi
