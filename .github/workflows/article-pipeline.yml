name: Canonical Article Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: candidate or publish
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - publish
  push:
    branches: [main]
    paths:
      - ".github/workflows/article-pipeline.yml"
  schedule:
    # Monday 09:00 JST.
    - cron: "0 0 * * 1"
    # Monthly finalization retries: 25th, 27th, 29th at 09:30 JST.
    - cron: "30 0 25,27,29 * *"

permissions:
  contents: write
  models: read

concurrency:
  group: canonical-article-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "mode=candidate" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "0 0 * * 1" ]]; then
            echo "mode=candidate" >> "$GITHUB_OUTPUT"
          else
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          fi

      - name: Pin current GitHub REST API version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          current = "2026-03-10"

          core = Path("pipeline/core.py")
          text = core.read_text(encoding="utf-8")
          needle = '            "Accept": "application/vnd.github+json",\n            "Authorization":'
          replacement = (
              '            "Accept": "application/vnd.github+json",\n'
              f'            "X-GitHub-Api-Version": "{current}",\n'
              '            "Authorization":'
          )
          if needle not in text and f'"X-GitHub-Api-Version": "{current}"' not in text:
              raise SystemExit("GitHub Models request header insertion point not found")
          core.write_text(text.replace(needle, replacement, 1), encoding="utf-8")

          graphiti = Path("pipeline/graphiti.py")
          text = graphiti.read_text(encoding="utf-8")
          text = text.replace(
              '"X-GitHub-Api-Version": "2022-11-28"',
              f'"X-GitHub-Api-Version": "{current}"',
          )
          graphiti.write_text(text, encoding="utf-8")
          PY

      - name: Preflight audit
        run: |
          python -m compileall pipeline
          python -m unittest discover -s tests -v
          python -m pipeline.audit

      - name: Generate or publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRAPHITI_READ_TOKEN: ${{ secrets.GRAPHITI_READ_TOKEN }}
          GRAPHITI_REPO: KAFKA2306/graphiti
          ARTICLE_MODEL: openai/gpt-4.1
        run: python -m pipeline.cli "${{ steps.mode.outputs.mode }}"

      - name: Postflight audit
        run: python -m pipeline.audit

      - name: Commit canonical outputs
        shell: bash
        run: |
          git add -A artifacts articles
          if git diff --cached --quiet; then
            echo "No canonical output changes"
            exit 0
          fi
          git config user.name "article-pipeline[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: ${{ steps.mode.outputs.mode }} canonical article pipeline"
          git push
