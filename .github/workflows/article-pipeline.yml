name: Canonical Article Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: candidate or publish
        required: true
        default: candidate
        type: choice
        options:
          - candidate
          - publish
  schedule:
    # Monday 09:00 JST.
    - cron: "0 0 * * 1"
    # Monthly finalization retries: 25th, 27th, 29th at 09:30 JST.
    - cron: "30 0 25,27,29 * *"

permissions:
  contents: write
  models: read

concurrency:
  group: canonical-article-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "0 0 * * 1" ]]; then
            echo "mode=candidate" >> "$GITHUB_OUTPUT"
          else
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight audit
        run: |
          python -m compileall pipeline
          python -m unittest discover -s tests -v
          python -m pipeline.audit

      - name: Generate or publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRAPHITI_READ_TOKEN: ${{ secrets.GRAPHITI_READ_TOKEN }}
          GRAPHITI_REPO: KAFKA2306/graphiti
          ARTICLE_MODEL: openai/gpt-4.1
        run: python -m pipeline.cli "${{ steps.mode.outputs.mode }}"

      - name: Postflight audit
        run: python -m pipeline.audit

      - name: Commit canonical outputs
        shell: bash
        run: |
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "article-pipeline[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A artifacts articles
          git commit -m "content: ${{ steps.mode.outputs.mode }} canonical article pipeline"
          git push
