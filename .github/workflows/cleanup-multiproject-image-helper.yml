name: Cleanup multiproject image helper

on:
  push:
    branches:
      - edit/embed-multiproject-autonomy-images

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require completed image embedding
        run: |
          python - <<'PY'
          from pathlib import Path
          article = Path("artifacts/candidates/2026-08/2026-08-13-chatgpt-multiproject-autonomy.md").read_text(encoding="utf-8")
          assert article.count("/images/chatgpt-multiproject-autonomy/") == 10
          assert article.count("published: false") == 1
          for number in range(1, 11):
              path = Path(f"images/chatgpt-multiproject-autonomy/chatgpt-multiproject-autonomy-{number:02d}.webp")
              assert path.is_file() and path.stat().st_size > 0, path
          PY
      - name: Remove temporary helper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/embed_multiproject_images.py
          git rm .github/workflows/embed-multiproject-images.yml
          git rm .github/workflows/cleanup-multiproject-image-helper.yml
          git commit -m "chore: remove temporary illustration helper"
          git push
