name: Temporary Muchio BOOTH Observation

on:
  push:
    branches:
      - article/muchio-intelligence-value
    paths:
      - .github/workflows/tmp-muchio-booth-observe.yml

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current wishlist count
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          url = 'https://accounts.booth.pm/wish_lists.json?item_ids%5B%5D=8657397'
          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
          with urllib.request.urlopen(req, timeout=20) as r:
              print('CURRENT_WISHLIST_ENDPOINT=' + r.read().decode())
          PY

      - name: Probe archived wishlist endpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.parse, urllib.request
          patterns = [
            'https://accounts.booth.pm/wish_lists.json?item_ids%5B%5D=8657397',
            'https://accounts.booth.pm/wish_lists.json?item_ids[]=8657397',
            'https://accounts.booth.pm/wish_lists.json?*8657397*',
          ]
          for target in patterns:
              q = {'url':target,'from':'20260728','to':'20260815','output':'json','filter':'statuscode:200','fl':'timestamp,original,digest'}
              url = 'https://web.archive.org/cdx/search/cdx?' + urllib.parse.urlencode(q)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=20) as r: rows=json.load(r)
              except Exception as e:
                  print('CDX_ERROR', target, repr(e)); continue
              print('CDX', target, json.dumps(rows))
              for row in rows[1:]:
                  ts, original = row[0], row[1]
                  archived=f'https://web.archive.org/web/{ts}id_/{original}'
                  try:
                      req=urllib.request.Request(archived,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json'})
                      with urllib.request.urlopen(req,timeout=20) as r: body=r.read().decode('utf-8','replace')
                      print('ARCHIVED_ENDPOINT', ts, original, body[:1000])
                  except Exception as e:
                      print('ARCHIVE_ERROR', ts, original, repr(e))
          PY
