name: Temporary Muchio BOOTH Observation

on:
  push:
    branches:
      - article/muchio-intelligence-value
    paths:
      - .github/workflows/tmp-muchio-booth-observe.yml

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current BOOTH item JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.request

          url = 'https://booth.pm/ja/items/8657397'
          req = urllib.request.Request(url, headers={'Accept': 'application/json', 'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)
          print('CURRENT_WISH_LISTS_COUNT=' + str(data.get('wish_lists_count')))
          print('CURRENT_NAME=' + str(data.get('name')))
          print('CURRENT_PRICE=' + str(data.get('price')))
          PY

      - name: Extract Wayback wishlist history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import json
          import re
          import urllib.parse
          import urllib.request

          targets = [
              'https://booth.pm/ja/items/8657397',
              'https://booth.pm/items/8657397',
              'https://iwanuga.booth.pm/items/8657397',
          ]
          seen = set()
          for target in targets:
              cdx = 'https://web.archive.org/cdx/search/cdx?' + urllib.parse.urlencode({
                  'url': target,
                  'from': '20260728',
                  'to': '20260815',
                  'output': 'json',
                  'filter': 'statuscode:200',
                  'fl': 'timestamp,original,digest',
                  'collapse': 'digest',
              })
              req = urllib.request.Request(cdx, headers={'User-Agent': 'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      rows = json.load(r)
              except Exception as e:
                  print(f'CDX_ERROR {target} {e!r}')
                  continue
              print('CDX ' + target + ' ' + json.dumps(rows, ensure_ascii=False))
              for row in rows[1:]:
                  ts, original = row[0], row[1]
                  key = (ts, original)
                  if key in seen:
                      continue
                  seen.add(key)
                  archived = f'https://web.archive.org/web/{ts}id_/{original}'
                  req = urllib.request.Request(archived, headers={'User-Agent': 'Mozilla/5.0'})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          body = r.read().decode('utf-8', errors='replace')
                  except Exception as e:
                      print(f'FETCH_ERROR {ts} {original} {e!r}')
                      continue

                  patterns = [
                      r'"wish_lists_count"\s*:\s*(\d+)',
                      r'wish_lists_count[^0-9]{0,80}(\d+)',
                      r'wishlist[^0-9]{0,80}(\d+)',
                      r'item-card__wish-list[^0-9]{0,120}(\d+)',
                  ]
                  values = []
                  for pattern in patterns:
                      values.extend(re.findall(pattern, body, flags=re.I))
                  print(f'ARCHIVE {ts} {original} bytes={len(body)} VALUES={values[:20]}')
                  for token in ['wish_lists_count', 'wish-list', 'wishlist', 'スキ']:
                      pos = body.lower().find(token.lower())
                      if pos >= 0:
                          snippet = html.unescape(body[max(0,pos-200):pos+400]).replace('\n',' ')
                          print(f'CONTEXT {ts} {token} {snippet[:600]}')
          PY
