name: Verification Stack v2 Autonomous Controller

on:
  push:
    branches:
      - experiment/verification-stack-v2-ground-truth
    paths:
      - "benchmarks/verification-stack-v2/**"
      - ".github/workflows/verification-stack-v2-autonomous.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verification-stack-v2-autonomous
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical workline
        uses: actions/checkout@v4
        with:
          ref: experiment/verification-stack-v2-ground-truth
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python clean baseline
        run: |
          python -m compileall benchmarks/verification-stack-v2/python/src
          python -m unittest discover -s benchmarks/verification-stack-v2/python/tests -v

      - name: Advance deterministic phase controller
        run: python benchmarks/verification-stack-v2/controller.py --write-state

      - name: Commit state transition when a gate advanced
        shell: bash
        run: |
          if git diff --quiet -- benchmarks/verification-stack-v2/state.json; then
            echo "No state transition. Controller stopped at the first unmet gate."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/verification-stack-v2/state.json
          git commit -m "experiment: advance verification-stack v2 state"
          git push origin HEAD:experiment/verification-stack-v2-ground-truth
