name: Verification Stack v2 Freeze Real Repo Sample

on:
  push:
    branches:
      - experiment/verification-stack-v2-ground-truth
    paths:
      - "benchmarks/verification-stack-v2/freeze_real_repo_sample.py"
      - "benchmarks/verification-stack-v2/AMENDMENT-v2.3-real-repo-sampling.md"
      - ".github/workflows/verification-stack-v2-freeze-real-repos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verification-stack-v2-freeze-real-repos
  cancel-in-progress: true

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert sampling phase and exact trigger SHA
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import json
          s=json.load(open('benchmarks/verification-stack-v2/state.json', encoding='utf-8'))
          assert s['phase'] == 'controlled_results_ready', s
          assert s['comparison_started'] is True, s
          assert s['real_repo_sample_frozen'] is False, s
          assert s['publication_authorized'] is False, s
          PY
      - name: Freeze deterministic eligible inventory and exact SHAs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python benchmarks/verification-stack-v2/freeze_real_repo_sample.py
      - name: Advance state from frozen sample only
        run: python benchmarks/verification-stack-v2/controller.py --write-state
      - name: Refuse commit if canonical head moved
        run: |
          remote_head="$(git ls-remote origin refs/heads/experiment/verification-stack-v2-ground-truth | awk '{print $1}')"
          echo "trigger=$GITHUB_SHA remote=$remote_head"
          test "$remote_head" = "$GITHUB_SHA"
      - name: Commit frozen sample and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/verification-stack-v2/real-repo-sample.json benchmarks/verification-stack-v2/state.json
          git commit -m "experiment: freeze external-validity repository sample for $GITHUB_SHA"
          git push origin HEAD:experiment/verification-stack-v2-ground-truth
