name: Verification Stack v2 Pyrefly Preset Calibration

on:
  push:
    branches:
      - fix/verification-stack-v2-evidence-integrity
    paths:
      - "scripts/verification_stack_v2_pyrefly_preset_calibration.py"
      - ".github/workflows/verification-stack-v2-pyrefly-preset-calibration.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verification-stack-v2-pyrefly-preset-calibration
  cancel-in-progress: true

jobs:
  calibrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact pinned calibration dependencies
        run: |
          python - <<'PY'
          import json, subprocess, sys
          c=json.load(open('benchmarks/verification-stack-v2/candidate-versions.json', encoding='utf-8'))['candidates']
          subprocess.check_call([
              sys.executable,'-m','pip','install','--disable-pip-version-check',
              f"pyrefly=={c['pyrefly']['version']}",
              f"pydantic=={c['pydantic']['version']}",
          ])
          PY

      - name: Verify frozen inputs and run calibration
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import json
          m=json.load(open('benchmarks/verification-stack-v2/mutants.json', encoding='utf-8'))
          assert len(m['mutants']) == 22
          v=json.load(open('benchmarks/verification-stack-v2/candidate-versions.json', encoding='utf-8'))
          assert v['candidates']['pyrefly']['version'] == '1.2.0'
          assert v['candidates']['pydantic']['version'] == '2.13.4'
          PY
          python scripts/verification_stack_v2_pyrefly_preset_calibration.py

      - name: Refuse commit if branch head moved
        run: |
          remote_head="$(git ls-remote origin refs/heads/fix/verification-stack-v2-evidence-integrity | awk '{print $1}')"
          echo "trigger=$GITHUB_SHA remote=$remote_head"
          test "$remote_head" = "$GITHUB_SHA"

      - name: Commit calibration evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/verification-stack-v2/results/controlled/pyrefly-preset-calibration.json
          git commit -m "audit: record Pyrefly preset calibration for $GITHUB_SHA"
          git push origin HEAD:fix/verification-stack-v2-evidence-integrity
