name: Zenn Manual Release

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Stage exactly one approved article for Zenn"
        required: true
        type: string
      action:
        description: "Desired Zenn state for this article"
        required: true
        default: publish
        type: choice
        options:
          - publish
          - unpublish
      confirm:
        description: "Create one pending Zenn production change"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: zenn-manual-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate explicit release intent
        shell: bash
        env:
          SLUG: ${{ inputs.slug }}
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "true" || {
            echo "explicit confirmation is required"
            exit 1
          }

          python -m pipeline.zenn_slug --slug "$SLUG"
          test -f "articles/${SLUG}.md"

          case "$ACTION" in
            publish)
              EXPECTED_PUBLISHED=true
              grep -q '^published_at:' "articles/${SLUG}.md"
              ;;
            unpublish)
              EXPECTED_PUBLISHED=false
              ;;
            *)
              echo "unsupported action: $ACTION"
              exit 1
              ;;
          esac

          grep -q "^published: ${EXPECTED_PUBLISHED}$" "articles/${SLUG}.md" || {
            echo "main does not match requested state: ${SLUG} -> published:${EXPECTED_PUBLISHED}"
            exit 1
          }

          python -m pipeline.audit
          bash scripts/zenn-render-check.sh

      - name: Refuse a second pending production change
        shell: bash
        run: |
          set -euo pipefail
          open_count="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base zenn-release \
            --state open \
            --json number \
            --jq 'length')"
          if [[ "$open_count" != "0" ]]; then
            echo "A zenn-release pull request is already pending; merge or close it first."
            exit 1
          fi

      - name: Stage exactly one article as a pull request
        shell: bash
        env:
          SLUG: ${{ inputs.slug }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          git fetch origin zenn-release
          git worktree add _zenn_release origin/zenn-release

          cp "articles/${SLUG}.md" "_zenn_release/articles/${SLUG}.md"
          rm -rf "_zenn_release/images/${SLUG}"
          if [[ -d "images/${SLUG}" ]]; then
            mkdir -p "_zenn_release/images"
            cp -R "images/${SLUG}" "_zenn_release/images/${SLUG}"
          fi

          cd _zenn_release
          git add -A

          if git diff --cached --quiet; then
            echo "NO_DEPLOY: zenn-release already contains the requested snapshot"
            exit 0
          fi

          mapfile -t changed < <(git diff --cached --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              "articles/${SLUG}.md"|"images/${SLUG}/"*)
                ;;
              *)
                echo "refusing unrelated zenn-release change: $path"
                exit 1
                ;;
            esac
          done

          article_changes="$(printf '%s\n' "${changed[@]}" | grep -c '^articles/.*\.md$' || true)"
          if [[ "$article_changes" -gt 1 ]]; then
            echo "refusing multi-article release diff"
            exit 1
          fi

          git diff --cached --check

          branch="zenn-sync/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "stage: ${ACTION} ${SLUG}"
          git push origin HEAD:"$branch"

          body="$(cat <<EOF
          This PR is the only staged production change for Zenn.

          - slug: \`${SLUG}\`
          - action: \`${ACTION}\`
          - source: \`main\`
          - target: \`zenn-release\`

          Merging this PR changes the Zenn Connect branch once and therefore requests one Zenn deployment.
          Do not add unrelated files or additional article slugs to this PR.
          EOF
          )"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base zenn-release \
            --head "$branch" \
            --title "Zenn: ${ACTION} ${SLUG}" \
            --body "$body"
