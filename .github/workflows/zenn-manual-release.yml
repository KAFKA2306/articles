name: Zenn Manual Release

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Release or reconcile exactly one approved article"
        required: true
        type: choice
        options:
          - 2026-08-15-ai-character-intelligence-muchio
          - chatgpt-multiproject-autonomy
          - claude-watermark-secret-key-detection
          - codex-chatgpt-github-issue-bridge
          - opencode-go-deepseek-v4-chatgpt-usage-scale
          - unity-mcp-editor-boundary
          - validate-before-pages-deploy
          - why-i-could-buy-the-crash

permissions:
  contents: write

concurrency:
  group: zenn-manual-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Preflight contracts
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          python -m unittest tests.test_zenn_slug tests.test_publication_diff tests.test_zenn_production -v
          python -m pipeline.zenn_slug
          python -m pipeline.zenn_slug --slug "$SLUG"

      - name: Resolve desired publication state
        id: state
        shell: bash
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          slug = os.environ["SLUG"]
          path = Path("articles") / f"{slug}.md"
          if not path.is_file():
              raise SystemExit(f"unknown article: {slug}")
          text = path.read_text(encoding="utf-8")
          parts = text.split("---\n", 2)
          if len(parts) != 3:
              raise SystemExit(f"invalid front matter: {path}")
          front = parts[1]
          if front.count("published: false") == 1 and "published: true" not in front:
              front = front.replace("published: false", "published: true", 1)
              path.write_text(f"---\n{front}---\n{parts[2]}", encoding="utf-8")
              mode = "promote"
          elif front.count("published: true") == 1 and "published: false" not in front:
              mode = "reconcile"
          else:
              raise SystemExit(f"ambiguous publication state: {path}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"mode={mode}\n")
          print(f"publication_mode={mode} slug={slug}")
          PY

      - name: Push publication intent
        if: steps.state.outputs.mode == 'promote'
        shell: bash
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          python -m pipeline.zenn_slug
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "articles/${SLUG}.md"
          git commit -m "publish: release ${SLUG} through verified gate"
          git push origin HEAD:main

      - name: Retrigger targeted Zenn deploy
        if: steps.state.outputs.mode == 'reconcile'
        shell: bash
        env:
          SLUG: ${{ inputs.slug }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          slug = os.environ["SLUG"]
          run_id = os.environ["RUN_ID"]
          path = Path("articles") / f"{slug}.md"
          text = path.read_text(encoding="utf-8")
          parts = text.split("---\n", 2)
          if len(parts) != 3 or parts[1].count("published: true") != 1:
              raise SystemExit(f"cannot reconcile non-publication-intent article: {path}")
          body = parts[2].lstrip("\n")
          body = re.sub(
              r"^<!-- zenn-deploy-sync: [^>]+ -->\n+",
              "",
              body,
              count=1,
          )
          marker = f"<!-- zenn-deploy-sync: {run_id} -->\n\n"
          path.write_text(
              f"---\n{parts[1]}---\n{marker}{body}",
              encoding="utf-8",
          )
          PY
          python -m pipeline.zenn_slug
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "articles/${SLUG}.md"
          git commit -m "deploy: retrigger Zenn sync for ${SLUG}"
          git push origin HEAD:main

      - name: Verify Zenn production
        id: verify
        continue-on-error: true
        env:
          ZENN_USERNAME: kafka2306
        run: |
          python -m pipeline.zenn_production --wait-seconds 900 --interval-seconds 15

      - name: Report deploy pending without rollback
        if: steps.verify.outcome != 'success'
        shell: bash
        run: |
          echo "DEPLOY_PENDING ${{ inputs.slug }}"
          echo "Publication intent remains published:true; no rollback push is emitted."
          exit 1

      - name: Confirm release
        if: steps.verify.outcome == 'success'
        run: echo "PUBLISHED_VERIFIED ${{ inputs.slug }}"
