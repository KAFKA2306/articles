name: Zenn Pending Normalization

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zenn-metadata-repair.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mark unverified articles pending
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pending = [
              "articles/chatgpt-multiproject-autonomy.md",
              "articles/claude-watermark-secret-key-detection.md",
              "articles/codex-chatgpt-github-issue-bridge.md",
              "articles/opencode-go-deepseek-v4-chatgpt-usage-scale.md",
              "articles/unity-mcp-editor-boundary.md",
              "articles/validate-before-pages-deploy.md",
              "articles/why-i-could-buy-the-crash.md",
          ]

          for raw_path in pending:
              path = Path(raw_path)
              text = path.read_text(encoding="utf-8")
              front, body = text.split("---\n", 2)[1:]
              true_line = "published: true"
              false_line = "published: false"
              if false_line in front and true_line not in front:
                  print(f"already pending: {raw_path}")
                  continue
              if front.count(true_line) != 1:
                  raise SystemExit(
                      f"refusing normalization for {raw_path}: expected exactly one published:true in front matter"
                  )
              front = front.replace(true_line, false_line, 1)
              path.write_text(f"---\n{front}---\n{body}", encoding="utf-8")
              print(f"pending: {raw_path}")
          PY

      - name: Commit pending state
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- articles/; then
            echo "No changes to commit"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/
          git commit -m "repair: mark unverified Zenn articles pending"
          git push origin HEAD:main
