name: Zenn Production Verification

on:
  push:
    branches: [zenn-release]
    paths:
      - "articles/**"
      - "images/**"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout verifier
        uses: actions/checkout@v6
        with:
          ref: main
          path: main

      - name: Checkout deployed snapshot
        uses: actions/checkout@v6
        with:
          ref: zenn-release
          path: release

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify zenn-release against Zenn
        working-directory: main
        env:
          ZENN_USERNAME: kafka2306
        run: |
          python -m unittest tests.test_zenn_production -v
          python -m pipeline.zenn_production \
            --root ../release \
            --wait-seconds 0
