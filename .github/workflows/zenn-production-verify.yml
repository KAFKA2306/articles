name: Zenn Production Verification

on:
  push:
    branches: [main]
    paths:
      - "articles/**"
      - "pipeline/zenn_production.py"
      - "tests/test_zenn_production.py"
      - "docs/PUBLICATION.md"
      - ".github/workflows/zenn-production-verify.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verifier contract tests
        run: python -m unittest tests.test_zenn_production -v
      - name: Verify every published:true article on Zenn production
        shell: bash
        env:
          ZENN_USERNAME: kafka2306
        run: |
          set -euo pipefail
          wait_seconds=0
          if [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            if git cat-file -e "$before^{commit}" 2>/dev/null; then
              while IFS= read -r path; do
                [ -n "$path" ] || continue
                # A changed/deleted public article can require asynchronous Zenn convergence.
                # Draft-only edits should not create long-running production polls.
                if [ ! -e "$path" ] || grep -q '^published: true$' "$path"; then
                  wait_seconds=900
                  break
                fi
              done < <(git diff --name-only "$before" "${{ github.sha }}" -- articles/)
            fi
          fi
          python -m pipeline.zenn_production \
            --wait-seconds "$wait_seconds" \
            --interval-seconds 15
