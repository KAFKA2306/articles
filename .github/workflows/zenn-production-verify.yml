name: Zenn Production Verification

# Diagnostic pushes to this file perform an immediate RSS snapshot because no article diff is present.
on:
  push:
    branches: [main]
    paths:
      - "articles/**"
      - "pipeline/zenn_production.py"
      - "tests/test_zenn_production.py"
      - "docs/PUBLICATION.md"
      - ".github/workflows/zenn-production-verify.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zenn-production-diagnostic-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verifier contract tests
        run: python -m unittest tests.test_zenn_production -v
      - name: Verify every published:true article on Zenn production
        shell: bash
        env:
          ZENN_USERNAME: kafka2306
        run: |
          wait_seconds=0
          if [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            if git cat-file -e "$before^{commit}" 2>/dev/null && \
               ! git diff --quiet "$before" "${{ github.sha }}" -- articles/; then
              # Only an article change needs to wait for Zenn's asynchronous deploy.
              wait_seconds=600
            fi
          fi
          python -m pipeline.zenn_production \
            --wait-seconds "$wait_seconds" \
            --interval-seconds 15
