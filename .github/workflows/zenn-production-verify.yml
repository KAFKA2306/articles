name: Zenn Production Verification

on:
  push:
    branches: [zenn-release]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: zenn-release
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verifier contract tests
        run: python -m unittest tests.test_zenn_production -v
      - name: Verify every published:true article on Zenn production
        shell: bash
        env:
          ZENN_USERNAME: kafka2306
        run: |
          set -euo pipefail
          wait_seconds=0
          if [ "${{ github.event_name }}" = "push" ]; then
            # Every push to zenn-release is an intentional deploy event.
            wait_seconds=900
          fi
          python -m pipeline.zenn_production \
            --wait-seconds "$wait_seconds" \
            --interval-seconds 15
