name: Cancel Failed Zenn Release Loop

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zenn-release-cancel-once.yml

permissions:
  contents: read

concurrency:
  group: zenn-release-seven-once
  cancel-in-progress: true

jobs:
  cancel-predecessor:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Superseded failed Zenn release loop"
