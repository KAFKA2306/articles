name: Zenn Release Seven Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/zenn-release-seven-once.yml

permissions:
  contents: write

concurrency:
  group: zenn-release-seven-once
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Preflight contracts
        run: |
          python -m unittest tests.test_publication_diff tests.test_zenn_production -v

      - name: Release seven approved pending articles sequentially
        id: release
        shell: bash
        env:
          ZENN_USERNAME: kafka2306
        run: |
          set -euo pipefail

          slugs=(
            chatgpt-multiproject-autonomy
            claude-watermark-secret-key-detection
            codex-chatgpt-github-issue-bridge
            opencode-go-deepseek-v4-chatgpt-usage-scale
            unity-mcp-editor-boundary
            validate-before-pages-deploy
            why-i-could-buy-the-crash
          )
          failures=()

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          push_main() {
            if ! git push origin HEAD:main; then
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          }

          for slug in "${slugs[@]}"; do
            git pull --ff-only origin main
            SLUG="$slug" python - <<'PY'
          import os
          from pathlib import Path

          slug = os.environ["SLUG"]
          path = Path("articles") / f"{slug}.md"
          if not path.is_file():
              raise SystemExit(f"unknown article: {slug}")
          text = path.read_text(encoding="utf-8")
          parts = text.split("---\n", 2)
          if len(parts) != 3:
              raise SystemExit(f"invalid front matter: {path}")
          front = parts[1]
          if front.count("published: false") != 1 or "published: true" in front:
              raise SystemExit(f"article is not in the approved pending state: {path}")
          front = front.replace("published: false", "published: true", 1)
          path.write_text(f"---\n{front}---\n{parts[2]}", encoding="utf-8")
          print(f"promoted: {slug}")
          PY
            git diff --check
            git add "articles/${slug}.md"
            git commit -m "publish: release ${slug} through verified gate"
            push_main

            if python -m pipeline.zenn_production --wait-seconds 600 --interval-seconds 15; then
              echo "PUBLISHED_VERIFIED ${slug}"
              echo "- PUBLISHED_VERIFIED ${slug}" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            echo "production verification failed; rolling back ${slug}" >&2
            SLUG="$slug" python - <<'PY'
          import os
          from pathlib import Path

          slug = os.environ["SLUG"]
          path = Path("articles") / f"{slug}.md"
          text = path.read_text(encoding="utf-8")
          parts = text.split("---\n", 2)
          if len(parts) != 3 or parts[1].count("published: true") != 1:
              raise SystemExit(f"cannot safely roll back {path}")
          front = parts[1].replace("published: true", "published: false", 1)
          path.write_text(f"---\n{front}---\n{parts[2]}", encoding="utf-8")
          PY
            git diff --check
            git add "articles/${slug}.md"
            git commit -m "rollback: Zenn production did not verify ${slug}"
            push_main
            failures+=("$slug")
          done

          if ((${#failures[@]})); then
            printf 'FAILED %s\n' "${failures[@]}" >&2
            exit 1
          fi

          python -m pipeline.zenn_production --wait-seconds 120 --interval-seconds 15

      - name: Remove one-time workflow after success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zenn-release-seven-once.yml
          git commit -m "chore: remove one-time Zenn seven-article release workflow"
          if ! git push origin HEAD:main; then
            git pull --rebase origin main
            git push origin HEAD:main
          fi
