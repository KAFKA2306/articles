name: Zenn Response Diagnostic

on:
  push:
    paths:
      - '.github/workflows/zenn-response-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Capture Zenn production responses
        shell: bash
        run: |
          set -u
          for slug in \
            2026-08-14-05-compatibility-is-not-validation \
            2026-08-15-affected-set-is-a-contract \
            2026-08-16-ai-added-decision-cost-audit; do
            echo "===== $slug ====="
            code="$(curl --silent --show-error --location \
              --output /tmp/zenn-body \
              --write-out '%{http_code}' \
              "https://zenn.dev/api/articles/$slug")"
            echo "HTTP $code"
            cat /tmp/zenn-body
            echo
          done

          echo '===== kafka2306 latest ====='
          curl --silent --show-error --location \
            'https://zenn.dev/api/articles?username=kafka2306&order=latest'
          echo
